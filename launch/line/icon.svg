<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- ホーム画面のショートカット用アイコン（LINE を開く）。
     背景は黒。LINE らしく分かるよう、緑の吹き出し（左下にしっぽ）にしている。
     公式ロゴそのものではなく、形と色を寄せた自作の絵。 -->
<defs>
  <radialGradient id="bg" cx=".5" cy=".42" r=".72">
    <stop offset="0" stop-color="#101013"/><stop offset=".6" stop-color="#070708"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <linearGradient id="grn" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#4BE58C"/><stop offset=".35" stop-color="#12CE67"/>
    <stop offset=".72" stop-color="#06C755"/><stop offset="1" stop-color="#03974A"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>

<!-- 吹き出し（本体＋左下のしっぽ） -->
<g>
  <g filter="url(#glow)" opacity=".4"><path fill="#06C755" d="M300,210 H724 A150,150 0 0 1 874,360 V540 A150,150 0 0 1 724,690 H392 L226,812 L300,690 A150,150 0 0 1 150,540 V360 A150,150 0 0 1 300,210 Z"/></g>
  <path fill="url(#grn)" d="M300,210 H724 A150,150 0 0 1 874,360 V540 A150,150 0 0 1 724,690 H392 L226,812 L300,690 A150,150 0 0 1 150,540 V360 A150,150 0 0 1 300,210 Z"/>
  <!-- 上面の艶 -->
  <path fill="url(#gloss)" d="M300,210 H724 A150,150 0 0 1 874,360 V404 C700,346 324,346 150,404 V360 A150,150 0 0 1 300,210 Z"/>
</g>
</svg>

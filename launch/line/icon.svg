<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- ホーム画面から開くショートカット用のアイコン（メッセージ）。
     LIFE のアイコンと同じ地（黒＋球のふち光）に、光る吹き出しを乗せている。 -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2=".4" y2="1">
    <stop offset="0" stop-color="#151A28"/><stop offset=".5" stop-color="#080A11"/>
    <stop offset="1" stop-color="#020306"/>
  </linearGradient>
  <radialGradient id="sphA" cx=".38" cy=".3" r=".78">
    <stop offset="0" stop-color="#141A2B"/><stop offset=".72" stop-color="#080B14"/>
    <stop offset="1" stop-color="#04050A"/>
  </radialGradient>
  <radialGradient id="sphB" cx=".62" cy=".7" r=".78">
    <stop offset="0" stop-color="#171529"/><stop offset=".7" stop-color="#0A0912"/>
    <stop offset="1" stop-color="#050409"/>
  </radialGradient>
  <linearGradient id="rimA" x1=".1" y1="0" x2=".7" y2=".75">
    <stop offset="0" stop-color="#BFD8FF"/><stop offset=".22" stop-color="#5B8AE8"/>
    <stop offset=".5" stop-color="#1E3568" stop-opacity=".5"/>
    <stop offset=".78" stop-color="#0B1024" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rimB" x1=".85" y1=".9" x2=".2" y2=".15">
    <stop offset="0" stop-color="#C9BEFF"/><stop offset=".25" stop-color="#6C5CC4"/>
    <stop offset=".6" stop-color="#241E44" stop-opacity=".4"/>
    <stop offset="1" stop-color="#0B0A18" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="chat" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#8DF3B4"/><stop offset=".35" stop-color="#2ED67E"/>
    <stop offset=".7" stop-color="#0FB585"/><stop offset="1" stop-color="#0A7E74"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>

<g>
  <circle cx="132" cy="96" r="330" fill="url(#sphB)"/>
  <circle cx="132" cy="96" r="330" fill="none" stroke="url(#rimB)" stroke-width="22"
    filter="url(#glow)" opacity=".75"/>
  <circle cx="132" cy="96" r="330" fill="none" stroke="url(#rimB)" stroke-width="5"/>
</g>
<g>
  <circle cx="836" cy="906" r="428" fill="url(#sphA)"/>
  <circle cx="836" cy="906" r="428" fill="none" stroke="url(#rimA)" stroke-width="26"
    filter="url(#glow)" opacity=".9"/>
  <circle cx="836" cy="906" r="428" fill="none" stroke="url(#rimA)" stroke-width="6"/>
</g>

<!-- 吹き出し -->
<g transform="translate(0,-14)">
  <g filter="url(#glowS)" opacity=".5">
    <rect x="266" y="286" width="492" height="374" rx="120" fill="#2ED67E"/>
    <path d="M366,606 L486,606 L330,752 Z" fill="#2ED67E"/>
  </g>
  <rect x="266" y="286" width="492" height="374" rx="120" fill="url(#chat)"/>
  <path d="M366,606 L486,606 L330,752 Z" fill="url(#chat)"/>
  <rect x="292" y="312" width="440" height="150" rx="86" fill="#FFFFFF" opacity=".14"/>
  <g fill="#06231C">
    <circle cx="408" cy="474" r="36"/><circle cx="512" cy="474" r="36"/><circle cx="616" cy="474" r="36"/>
  </g>
</g>

<path d="M0,0 H1024 V300 C700,392 320,392 0,300 Z" fill="#FFFFFF" opacity=".035"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- LIFE のホーム画面アイコン。
     真っ黒な地に、暗がりの中のフクロウが浮かび上がる絵。
     体は下へ向かって闇に溶け、月明かり（左上から）のふち光と、
     金色に光る目だけがはっきり見える。フクロウは暗い L に止まっている。
     iOS 側で角丸に切り抜かれるので、四隅まで塗りつぶす。 -->
<defs>
<radialGradient id="bg" cx=".5" cy=".3" r=".78">
  <stop offset="0" stop-color="#0C0912"/><stop offset=".5" stop-color="#050408"/>
  <stop offset="1" stop-color="#000000"/>
</radialGradient>
<linearGradient id="body" x1=".34" y1="0" x2=".58" y2="1">
  <stop offset="0" stop-color="#9E93BD"/><stop offset=".28" stop-color="#5C5079"/>
  <stop offset=".6" stop-color="#2A2340"/><stop offset=".85" stop-color="#120E1B"/>
  <stop offset="1" stop-color="#07050B"/>
</linearGradient>
<linearGradient id="rim" x1=".2" y1="0" x2=".7" y2=".85">
  <stop offset="0" stop-color="#E4DAFF"/><stop offset=".3" stop-color="#A08FD6" stop-opacity=".7"/>
  <stop offset=".62" stop-color="#5B4E86" stop-opacity=".2"/>
  <stop offset="1" stop-color="#000000" stop-opacity="0"/>
</linearGradient>
<linearGradient id="dim" x1=".2" y1="0" x2=".8" y2="1">
  <stop offset="0" stop-color="#4A3F66"/><stop offset=".5" stop-color="#2C2440"/>
  <stop offset="1" stop-color="#141020"/>
</linearGradient>
<radialGradient id="eye" cx=".38" cy=".32" r=".8">
  <stop offset="0" stop-color="#FFF3D2"/><stop offset=".38" stop-color="#F5C173"/>
  <stop offset=".8" stop-color="#C98A2E"/><stop offset="1" stop-color="#7A4E12"/>
</radialGradient>
<filter id="g6" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g20" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="g46" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="46"/></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g transform="translate(512,512) scale(1.06) translate(-512,-512)"><g transform="translate(-40,-6)">
      <path d="M396,300 H556 V326 H512 V664 H648 V632 H676 V714 H396 V688 H440 V326 H396 Z" fill="url(#dim)"/>
      <path d="M396,300 H556 V326 H512 V664 H648 V632 H676 V714 H396 V688 H440 V326 H396 Z" fill="none" stroke="#6B5C93" stroke-width="3.5" opacity=".5"/></g></g>
    <g transform="translate(596,700)"><g transform="scale(1.34)">
  <path d="M0,-206 C54,-206 95,-172 95,-122 C95,-56 60,6 0,6 C-60,6 -95,-56 -95,-122 C-95,-172 -54,-206 0,-206 Z" fill="url(#body)"/>
  <path d="M-90,-158 L-74,-216 L-38,-186 Z" fill="url(#body)"/><path d="M90,-158 L74,-216 L38,-186 Z" fill="url(#body)"/>
  <!-- ふち光（月明かりが左上から当たっている想定） -->
  <g fill="none" stroke="url(#rim)" stroke-linejoin="round">
    <path d="M0,-206 C54,-206 95,-172 95,-122 C95,-56 60,6 0,6 C-60,6 -95,-56 -95,-122 C-95,-172 -54,-206 0,-206 Z" stroke-width="16" filter="url(#g20)" opacity=".8"/>
    <path d="M-90,-158 L-74,-216 L-38,-186 Z" stroke-width="14" filter="url(#g20)" opacity=".8"/>
    <path d="M90,-158 L74,-216 L38,-186 Z" stroke-width="14" filter="url(#g20)" opacity=".8"/>
    <path d="M0,-206 C54,-206 95,-172 95,-122 C95,-56 60,6 0,6 C-60,6 -95,-56 -95,-122 C-95,-172 -54,-206 0,-206 Z" stroke-width="5"/><path d="M-90,-158 L-74,-216 L-38,-186 Z" stroke-width="4.5"/><path d="M90,-158 L74,-216 L38,-186 Z" stroke-width="4.5"/>
  </g>
  <!-- 顔盤 -->
  <path fill="#1B1528" opacity=".55" d="M-84,-138 C-84,-178 -44,-192 -42,-152
    C-40,-116 -80,-108 -84,-138 Z M84,-138 C84,-178 44,-192 42,-152 C40,-116 80,-108 84,-138 Z"/>
  <!-- 光る目 -->
  <g filter="url(#g46)" opacity=".55">
    <circle cx="-42" cy="-146" r="40" fill="#F0B45E"/><circle cx="42" cy="-146" r="40" fill="#F0B45E"/></g>
  <g filter="url(#g6)" opacity=".95">
    <circle cx="-42" cy="-146" r="30" fill="#F7CE86"/><circle cx="42" cy="-146" r="30" fill="#F7CE86"/></g>
  <circle cx="-42" cy="-146" r="29" fill="url(#eye)"/><circle cx="42" cy="-146" r="29" fill="url(#eye)"/>
  <circle cx="-42" cy="-146" r="11" fill="#231A0C"/><circle cx="42" cy="-146" r="11" fill="#231A0C"/>
  <circle cx="-50" cy="-155" r="7" fill="#FFF8E6" opacity=".85"/>
  <circle cx="34" cy="-155" r="7" fill="#FFF8E6" opacity=".85"/>
  <path fill="#241C36" d="M0,-136 L-13,-104 L13,-104 Z"/>
  <path fill="none" stroke="url(#rim)" stroke-width="3" opacity=".5"
    d="M-70,-86 C-44,-62 -16,-50 0,-48 C16,-50 44,-62 70,-86"/>
</g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- LIFE のホーム画面アイコン。背景は黒。中央にアプリの金色の L を置く。
     iOS 側で角丸に切り抜かれるので、四隅まで塗りつぶす。 -->
<defs>
  <radialGradient id="bg" cx=".5" cy=".42" r=".72">
    <stop offset="0" stop-color="#101013"/><stop offset=".6" stop-color="#070708"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <linearGradient id="gold" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#F9EAC6"/><stop offset=".3" stop-color="#E3BF7F"/>
    <stop offset=".6" stop-color="#CFA45C"/><stop offset="1" stop-color="#8A6531"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>

<!-- 中央の L（アプリのブランド色） -->
<g transform="translate(512,512) scale(1.14) translate(-512,-512)">
  <g transform="translate(-26,6)">
    <path filter="url(#glow)" opacity=".4" fill="#CFA45C"
      d="M396,300 H556 V326 H512 V664 H648 V632 H676 V714 H396 V688 H440 V326 H396 Z"/>
    <path fill="url(#gold)"
      d="M396,300 H556 V326 H512 V664 H648 V632 H676 V714 H396 V688 H440 V326 H396 Z"/>
  </g>
</g>
</svg>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<body>
<!-- 筋トレの 3D 風イラストで使う塗り（グラデーションと発光）。
     図をいくつ描いても定義は 1 組で済むよう、ここに置いて id で参照する。 -->
<svg class="wdefs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="wgBody" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#26272D"/><stop offset=".16" stop-color="#55585F"/>
    <stop offset=".38" stop-color="#9EA3AD"/><stop offset=".56" stop-color="#7B7F88"/>
    <stop offset=".84" stop-color="#3D3F46"/><stop offset="1" stop-color="#212227"/>
  </linearGradient>
  <radialGradient id="wgHead" cx=".36" cy=".3" r=".82">
    <stop offset="0" stop-color="#B4B9C3"/><stop offset=".5" stop-color="#7A7E87"/>
    <stop offset="1" stop-color="#2A2C32"/>
  </radialGradient>
  <linearGradient id="wgRed" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7E1A0E"/><stop offset=".2" stop-color="#D33A22"/>
    <stop offset=".42" stop-color="#FF7A55"/><stop offset=".62" stop-color="#E8452A"/>
    <stop offset="1" stop-color="#6E170C"/>
  </linearGradient>
  <linearGradient id="wgIron" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9DA2AC"/><stop offset=".45" stop-color="#5A5E67"/>
    <stop offset="1" stop-color="#2C2E34"/>
  </linearGradient>
  <linearGradient id="wgBench" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3A3D45"/><stop offset="1" stop-color="#1E1F24"/>
  </linearGradient>
  <radialGradient id="wgFloor" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="wgGlow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs></svg>
<div class="stage">
  <div class="app" id="app">
    <div class="hint" aria-hidden="true"></div>
    <header class="topbar">
      <button class="ib" id="menuBtn" aria-label="メニューを開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand" id="brand"></div>
      <button class="sync" id="syncBtn" aria-label="接続状態"><span class="pulse" id="pulse"></span><span id="syncTxt">未接続</span></button>
    </header>
    <div class="notice" id="notice" hidden></div>
    <div class="sw">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" aria-label="検索">
        <span class="clr" id="clr" style="display:none" role="button" aria-label="クリア">×</span>
      </div>
      <div class="tagsug" id="tagsug" style="display:none"></div>
    </div>
    <div class="actzone" id="actzone"></div>
    <div class="scroll" id="scroll"></div>
    <nav class="bottombar" id="bottombar" aria-label="ナビゲーション"></nav>
    <div class="scrim" id="scrim"></div>
    <nav class="drawer" id="drawer" aria-label="メニュー"><div class="dh2"><span class="d"></span><span class="w">LIFE</span></div><div id="menu"></div></nav>
    <section class="det" id="det" aria-hidden="true">
      <div class="db"><button class="ib" id="backBtn" aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button><span class="dt" id="dSec"></span>
      <button class="ib" id="dDone" aria-label="完了にする" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>
      </button>
      <button class="ib" id="dEdit" aria-label="編集" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>
      </button>
      <button class="ib" id="dTrash" aria-label="削除" style="display:none;color:var(--ember)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
      </button></div>
      <div class="dbody" id="dBody"></div>
    </section>
    <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
  </div>
</div>
